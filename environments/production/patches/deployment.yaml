apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-app
spec:
  template:
    spec:
      containers:
        - name: dashboard-app
          # Updated by .github/workflows/commit.nuxt.yaml.
          image: ghcr.io/simonbrundin/dashboard@sha256:ac93ad630028de6962a6e9f532f8b2172192f082715c8144c44130749b6306fd
          env:
            - name: NODE_ENV
              value: "production"
            - name: NUXT_PUBLIC_APP_URL
              value: "https://dashboard.simonbrundin.com"
            - name: NUXT_MINIMAX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dashboard-auth
                  key: NUXT_MINIMAX_API_KEY
          envFrom:
            - secretRef:
                name: dashboard-uptime-kuma
