apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard-app
spec:
  template:
    spec:
      containers:
        - name: dashboard-app
          # Updated by .github/workflows/commit.nuxt.yaml.
          image: ghcr.io/simonbrundin/dashboard@sha256:e66f56a66d0722b0a7aa90d0fb53902d7bd701236a04f56f4174652f2e7e0155
          env:
            - name: NODE_ENV
              value: "production"
            - name: NUXT_PUBLIC_APP_URL
              value: "https://dashboard.simonbrundin.com"
            - name: NUXT_MINIMAX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dashboard-auth
                  key: NUXT_MINIMAX_API_KEY
          envFrom:
            - secretRef:
                name: dashboard-uptime-kuma
