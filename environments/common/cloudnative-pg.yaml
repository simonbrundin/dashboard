apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/cloudnative-pg/cloudnative-pg.git
  ref:
    semver: ">=1.0.0"
  ignore: |
    # Ignore Helm chart files
    /charts/
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 1h
  dependsOn:
    - name: cloudnative-pg-namespace
  sourceRef:
    kind: GitRepository
    name: cloudnative-pg
  path: ./config/crd
  prune: true
  wait: true
  targetNamespace: dashboard
---
# Note: The Cluster CRD will be created by the db/postgres-cluster.yaml
# This requires CNPG to be installed in the cluster first
# For now, we'll use a pre-existing CNPG installation
