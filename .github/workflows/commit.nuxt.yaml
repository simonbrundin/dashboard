name: CI för Nuxt applikation
on:
  push:
    paths:
      - src/nuxt/**
  workflow_dispatch:
jobs:
  unit-tests:
    permissions:
      contents: read
    uses: >-
      simonbrundin/deployment-pipeline/.github/workflows/run-tests-bun.yaml@main
    with:
      package-json-path: src/nuxt

  build-amd64:
    needs: unit-tests
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: environments/dev/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/simonbrundin/dashboard:build-amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-arm64:
    needs: unit-tests
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          dockerfile: environments/dev/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/simonbrundin/dashboard:build-arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  manifest:
    needs: [build-amd64, build-arm64]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest
        run: |
          docker manifest create ghcr.io/simonbrundin/dashboard:latest \
            ghcr.io/simonbrundin/dashboard:build-amd64 \
            ghcr.io/simonbrundin/dashboard:build-arm64
          docker manifest push ghcr.io/simonbrundin/dashboard:latest
          
          # Get SHA
          DIGEST=$(docker manifest inspect ghcr.io/simonbrundin/dashboard:latest | jq -r '.manifests[0].digest')
          echo "IMAGE=ghcr.io/simonbrundin/dashboard@${DIGEST}" >> $GITHUB_OUTPUT
          
      - name: Output image
        id: image
        run: echo "image=ghcr.io/simonbrundin/dashboard:latest" >> $GITHUB_OUTPUT

  update-deployment:
    needs: manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          ref: main

      - name: Update deployment image
        env:
          IMAGE: ${{ needs.manifest.outputs.image }}
        run: |
          echo "Updating image to: $IMAGE"
          sed -i "s|image: ghcr.io/simonbrundin/dashboard.*|image: $IMAGE|" \
            environments/production/patches/deployment.yaml
          cat environments/production/patches/deployment.yaml

      - name: Create PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update dashboard-app image [skip ci]"
          branch: bot/update-dashboard-app-image
          delete-branch: true
          title: "chore: update dashboard-app image"
          body: |
            Automated image update from commit workflow
            - Image: `${{ needs.manifest.outputs.image }}`
          labels: |
            ci
            skip-review
          add-paths: |
            environments/production/patches/deployment.yaml
